# drata-cli.yml - sample configuration file
#
# Credentials are NOT stored here. They live in a JSON file with named profiles:
#   ~/.config/drata/credentials.json   (mode 0600)
#
# Example credentials.json:
#   {
#     "profiles": {
#       "default": {
#         "drata":    { "api-key": "<your-key>", "region": "us", "allow-writes": false },
#         "safebase": { "api-key": "<your-key>", "allow-writes": false }
#       },
#       "prod": {
#         "drata":    { "api-key": "<your-key>", "region": "us", "allow-writes": true }
#       }
#     }
#   }
# Each block is optional; a profile needs at least one. An older flat profile
# ({ "api-key", "region", "allow-writes" }) still reads as the "drata" block.
#
# Create or update a block with:
#   drata login --api-key <your-key> --region us [--allow-writes]
#   drata safebase login --api-key <your-key> [--allow-writes]
#
# Precedence, per backend: CLI flags > env vars (DRATA_API_KEY / DRATA_REGION /
# SAFEBASE_API_KEY; DRATA_PROFILE picks the profile) > credentials file. Writes fail closed: a non-GET request requires a
# write-enabled credential (allow-writes: true) or the --allow-writes flag.
